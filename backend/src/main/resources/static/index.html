<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alert Fatigue Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 24px 40px;
        }

        .header h1 {
            margin: 0 0 8px;
        }

        .header p {
            margin: 0;
            opacity: 0.8;
        }

        .container {
            padding: 30px 40px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin: 0 0 12px;
            font-size: 16px;
            color: #555;
        }

        .value {
            font-size: 32px;
            font-weight: bold;
        }

        .status {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .status span {
            font-weight: bold;
        }

        .error {
            color: #c0392b;
        }

        .refresh {
            margin-top: 8px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 1000px) {
            .cards {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <h1>Alert Fatigue Dashboard</h1>
    <p>Monitoring and notification activity</p>
</header>

<main class="container">

    <div class="cards">

        <div class="card">
            <h3>Alerts Processed</h3>
            <div class="value" id="alertsProcessed">0</div>
        </div>

        <div class="card">
            <h3>Notifications Sent</h3>
            <div class="value" id="notificationsSent">0</div>
        </div>

        <div class="card">
            <h3>Notifications Skipped</h3>
            <div class="value" id="notificationsSkipped">0</div>
        </div>

        <div class="card">
            <h3>Notifications Failed</h3>
            <div class="value" id="notificationsFailed">0</div>
        </div>

        <div class="card">
            <h3>Total Notifications</h3>
            <div class="value" id="totalNotifications">0</div>
        </div>

    </div>

    <div class="status">

        Backend monitoring status:
        <span id="monitoringStatus">Checking...</span>

        <div class="refresh">
            Last updated:
            <span id="lastUpdated">Waiting...</span>
        </div>

        <p id="errorMessage" class="error"></p>

    </div>

</main>

<script>

    async function loadMonitoringData() {

        try {

            const response =
                await fetch("/api/monitoring/status");

            if (!response.ok) {
                throw new Error("Backend returned an error");
            }

            const data = await response.json();

            document.getElementById("alertsProcessed").textContent =
                data.alertsProcessed;

            document.getElementById("notificationsSent").textContent =
                data.notificationsSent;

            document.getElementById("notificationsSkipped").textContent =
                data.notificationsSkipped;

            document.getElementById("notificationsFailed").textContent =
                data.notificationsFailed;

            const totalNotifications =
                data.notificationsSent +
                data.notificationsSkipped +
                data.notificationsFailed;

            document.getElementById("totalNotifications").textContent =
                totalNotifications;

            document.getElementById("monitoringStatus").textContent =
                data.monitoring;

            document.getElementById("lastUpdated").textContent =
                new Date().toLocaleTimeString();

            document.getElementById("errorMessage").textContent = "";

        } catch (error) {

            document.getElementById("monitoringStatus").textContent =
                "Backend unavailable";

            document.getElementById("lastUpdated").textContent =
                "Update failed";

            document.getElementById("errorMessage").textContent =
                "Start the Spring Boot backend to load monitoring data.";
        }
    }

    loadMonitoringData();

    setInterval(loadMonitoringData, 5000);

</script>

</body>
</html>
